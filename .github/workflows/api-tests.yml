name: 真实 API 手动测试

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 选择需要调用真实 API 的测试
        required: true
        type: choice
        options:
          - aliyun-realtime
          - real-llm

permissions:
  contents: read

concurrency:
  group: manual-api-tests
  cancel-in-progress: false

jobs:
  api-tests:
    name: manual-api-tests
    # 只执行默认分支中经过审查的代码，不接受任意 PR 提交作为带密钥的执行对象。
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    environment: external-api
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: server
    env:
      PYTHONUTF8: '1'
      RUN_EXTERNAL_TESTS: '1'
      RUN_REAL_LLM_TESTS: '1'
      QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
      ALIYUN_REALTIME_SPEECH_API_KEY: ${{ secrets.ALIYUN_REALTIME_SPEECH_API_KEY }}
      ALIYUN_REALTIME_SPEECH_WORKSPACE_ID: ${{ vars.ALIYUN_REALTIME_SPEECH_WORKSPACE_ID }}
      ALIYUN_REALTIME_SPEECH_ENDPOINT: ${{ vars.ALIYUN_REALTIME_SPEECH_ENDPOINT }}
      ALIYUN_REALTIME_SPEECH_MODEL: ${{ vars.ALIYUN_REALTIME_SPEECH_MODEL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - name: 安装普通 API 测试依赖
        run: python -m pip install -e '.[dev]' httpx
      - name: 准备独立的测试配置
        env:
          SUITE: ${{ inputs.suite }}
          SERVER_TEST_CONFIG_JSON: ${{ secrets.SERVER_TEST_CONFIG_JSON }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          suite = os.environ['SUITE']
          if suite == 'aliyun-realtime':
              assert os.environ.get('ALIYUN_REALTIME_SPEECH_API_KEY'), '缺少实时语音测试密钥'
              assert os.environ.get('ALIYUN_REALTIME_SPEECH_MODEL'), '缺少实时语音测试模型'
              assert os.environ.get('ALIYUN_REALTIME_SPEECH_WORKSPACE_ID') or os.environ.get('ALIYUN_REALTIME_SPEECH_ENDPOINT'), '缺少工作空间或服务地址'
          if suite == 'real-llm':
              assert os.environ.get('QWEN_API_KEY'), '缺少 QWEN_API_KEY'
          config_text = os.environ.get('SERVER_TEST_CONFIG_JSON')
          if config_text:
              json.loads(config_text)
              Path('config/config.json').write_text(config_text, encoding='utf-8')
          else:
              Path('config/config.json').write_bytes(Path('config/config.json.template').read_bytes())
          PY
      - name: 运行选定的真实服务测试
        env:
          SUITE: ${{ inputs.suite }}
        run: |
          case "$SUITE" in
            aliyun-realtime)
              python -m pytest tests/e2e/external/test_aliyun_realtime_speech.py --run-external -q --tb=short --junitxml=api-results.xml
              ;;
            real-llm)
              python -m pytest tests/integration/persistence/test_agent_memory.py -m real_llm --run-real-llm -q --tb=short --junitxml=api-results.xml
              ;;
            *) echo '未知测试范围'; exit 1 ;;
          esac
      - name: 不将跳过或空测试集算作真实服务验证通过
        run: python ../.github/scripts/check_pytest_results.py api-results.xml
      - name: 清除工作区中的测试密钥文件
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ('config/config.json', 'api-results.xml'):
              Path(name).unlink(missing_ok=True)
          PY
