name: Agent refactor PR review

'on':
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited
  issue_comment:
    types:
      - created
  pull_request_review:
    types:
      - submitted
      - edited
      - dismissed
  pull_request_review_comment:
    types:
      - created
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: number

permissions:
  contents: read

concurrency:
  group: >-
    agent-refactor-review-${{
      github.event.pull_request.number ||
      github.event.issue.number ||
      inputs.pr_number ||
      github.run_id
    }}
  cancel-in-progress: true

jobs:
  resolve:
    if: >-
      vars.AGENT_PR_REVIEW_ENABLED == 'true' &&
      github.actor != 'chatgpt-codex-connector[bot]' &&
      (github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    outputs:
      duplicate: ${{ steps.resolve.outputs.duplicate }}
      eligible: ${{ steps.resolve.outputs.eligible }}
      base_sha: ${{ steps.resolve.outputs.base_sha }}
      event_key: ${{ steps.resolve.outputs.event_key }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      issue_numbers: ${{ steps.resolve.outputs.issue_numbers }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      stack_chain: ${{ steps.resolve.outputs.stack_chain }}
    steps:
      - name: Materialize trusted review policy
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          TRUSTED_SHA: ${{ github.workflow_sha }}
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const policyPath = ".github/codex/scripts/review-policy.js";
            const {data} = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: policyPath,
              ref: process.env.TRUSTED_SHA,
            });
            if (Array.isArray(data) || data.type !== "file" || !data.content) {
              throw new Error("Trusted review policy is not a readable file.");
            }
            const destination = path.join(
              process.env.GITHUB_WORKSPACE,
              ".review-automation",
              policyPath,
            );
            fs.mkdirSync(path.dirname(destination), {recursive: true});
            fs.writeFileSync(destination, Buffer.from(data.content, "base64"), {mode: 0o600});

      - name: Resolve and authorize the pull request
        id: resolve
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const policy = require(
              `${process.env.GITHUB_WORKSPACE}/.review-automation/.github/codex/scripts/review-policy.js`,
            );
            const internalDispatch =
              context.eventName === "workflow_dispatch" &&
              context.actor === "github-actions[bot]";
            if (!internalDispatch) {
              const allowedPermissions = new Set(["admin", "maintain", "write"]);
              const permission = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: context.actor,
              });
              if (!allowedPermissions.has(permission.data.permission)) {
                core.notice(`Ignoring untrusted trigger from ${context.actor}.`);
                core.setOutput("eligible", "false");
                return;
              }
            }

            let prNumber = context.payload.pull_request?.number;
            if (!prNumber && context.payload.issue?.pull_request) {
              prNumber = context.payload.issue.number;
            }
            if (!prNumber && context.eventName === "workflow_dispatch") {
              prNumber = Number(context.payload.inputs?.pr_number);
            }
            if (!Number.isInteger(prNumber) || prNumber <= 0) {
              core.notice("The event is not attached to a pull request.");
              core.setOutput("eligible", "false");
              return;
            }

            const {data: pull} = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            const repositoryName = `${context.repo.owner}/${context.repo.repo}`;
            let closingIssues = [];
            try {
              const graph = await github.graphql(
                `query($owner: String!, $repo: String!, $number: Int!) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $number) {
                      closingIssuesReferences(first: 50) { nodes { number } }
                    }
                  }
                }`,
                {owner: context.repo.owner, repo: context.repo.repo, number: prNumber},
              );
              closingIssues = graph.repository.pullRequest.closingIssuesReferences.nodes;
            } catch (error) {
              core.warning(`Could not read closing issue links: ${error.message}`);
            }
            const issueNumbers = policy.collectRelatedIssueNumbers(
              pull.title,
              pull.body,
              closingIssues,
              repositoryName,
            );
            if (!policy.isAgentIssueSet(issueNumbers)) {
              core.notice(
                `Ignoring PR #${prNumber}: explicit issue relationships must refer only to #60-#89.`,
              );
              core.setOutput("eligible", "false");
              return;
            }
            let stackChain;
            try {
              stackChain = await policy.resolvePullChain(
                pull,
                async (headRef) => github.paginate(github.rest.pulls.list, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: "open",
                  head: `${context.repo.owner}:${headRef}`,
                  per_page: 100,
                }),
                repositoryName,
                "refactor/agent",
              );
            } catch (error) {
              const marker = `<!-- agent-refactor-invalid-stack:${pull.base.sha}:${pull.head.sha} -->`;
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                per_page: 100,
              });
              if (!comments.some((comment) => (comment.body || "").includes(marker))) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body: [
                    marker,
                    "结论：**CHANGES_REQUESTED（流程）**",
                    "",
                    `当前 PR 无法解析为终止于 \`refactor/agent\` 的可信堆叠链：${error.message}。`,
                    "请将根 PR 的 base 修正为 `refactor/agent`；子 PR 必须以同仓库唯一开放父 PR 的 head 分支为 base，并保持父链开放、无环且可追溯。",
                  ].join("\n"),
                });
              }
              core.notice(`Rejected PR #${prNumber}: ${error.message}.`);
              core.setOutput("eligible", "false");
              return;
            }

            for (const parent of stackChain.slice(1)) {
              const parentReviews = await github.paginate(github.rest.pulls.listReviews, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: parent.number,
                per_page: 100,
              });
              const violation = policy.parentApprovalViolation(
                parentReviews,
                parent.head_sha,
              );
              if (violation) {
                const marker = `<!-- agent-refactor-parent-unapproved:${parent.number}:${parent.head_sha} -->`;
                const comments = await github.paginate(github.rest.issues.listComments, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  per_page: 100,
                });
                if (!comments.some((comment) => (comment.body || "").includes(marker))) {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: prNumber,
                    body: [
                      marker,
                      "结论：**CHANGES_REQUESTED（流程）**",
                      "",
                      `父 PR #${parent.number} 的当前 head \`${parent.head_sha}\` 尚未形成有效批准：${violation}。`,
                      "请先让父层当前 head 通过审核；旧 SHA 的批准、已撤销批准或当前修改请求均不能授权本层继续。",
                    ].join("\n"),
                  });
                }
                core.notice(`Rejected PR #${prNumber}: parent #${parent.number} is not approved.`);
                core.setOutput("eligible", "false");
                return;
              }
            }

            const eventKey = policy.buildEventKey(
              context.eventName,
              context.payload,
              pull.base.sha,
              pull.head.sha,
            );
            const marker = `<!-- agent-refactor-review-key:${eventKey} -->`;

            const [comments, reviews] = await Promise.all([
              github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                per_page: 100,
              }),
              github.paginate(github.rest.pulls.listReviews, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                per_page: 100,
              }),
            ]);
            const duplicate = [...comments, ...reviews].some((item) =>
              (item.body || "").includes(marker),
            );

            core.setOutput("eligible", "true");
            core.setOutput("duplicate", duplicate ? "true" : "false");
            core.setOutput("base_sha", pull.base.sha);
            core.setOutput("event_key", eventKey);
            core.setOutput("head_sha", pull.head.sha);
            core.setOutput("issue_numbers", JSON.stringify(issueNumbers));
            core.setOutput("pr_number", String(prNumber));
            core.setOutput("stack_chain", JSON.stringify(stackChain));

  review:
    needs: resolve
    if: >-
      needs.resolve.outputs.eligible == 'true' &&
      needs.resolve.outputs.duplicate != 'true'
    runs-on:
      - self-hosted
      - Windows
      - X64
      - agent-luotianyi-review
      - codex-chatgpt-auth
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      final_message: ${{ steps.codex.outputs.final-message }}
    steps:
      - name: Construct the pinned candidate repository
        id: candidate
        shell: pwsh
        env:
          CANDIDATE_BASE_SHA: ${{ needs.resolve.outputs.base_sha }}
          CANDIDATE_HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          TRUSTED_SHA: ${{ github.workflow_sha }}
        run: |
          $candidateRoot = Join-Path $env:RUNNER_TEMP "agent-refactor-candidate-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Path $candidateRoot -Force | Out-Null

          git -C $candidateRoot init
          git -C $candidateRoot remote add origin "https://github.com/$env:GITHUB_REPOSITORY.git"
          git -C $candidateRoot fetch --no-tags --no-recurse-submodules origin `
            $env:CANDIDATE_BASE_SHA $env:CANDIDATE_HEAD_SHA $env:TRUSTED_SHA
          if ($LASTEXITCODE -ne 0) {
            throw "Could not fetch the pinned base, head, and workflow commits."
          }
          git -C $candidateRoot checkout --detach $env:CANDIDATE_BASE_SHA
          if ($LASTEXITCODE -ne 0) {
            throw "Could not check out the pinned target commit."
          }
          git -C $candidateRoot config user.name "Agent refactor review"
          git -C $candidateRoot config user.email "agent-refactor-review@users.noreply.github.com"
          git -C $candidateRoot merge --no-commit --no-ff $env:CANDIDATE_HEAD_SHA
          if ($LASTEXITCODE -eq 0) {
            "CANDIDATE_MERGE_CLEAN=true" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } else {
            "CANDIDATE_MERGE_CLEAN=false" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            Write-Warning "The pinned base and head have merge conflicts; Codex will review them."
          }
          "candidate_root=$candidateRoot" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Materialize the trusted review bundle outside the candidate workspace
        id: trusted
        shell: pwsh
        env:
          CANDIDATE_ROOT: ${{ steps.candidate.outputs.candidate_root }}
          TRUSTED_SHA: ${{ github.workflow_sha }}
        run: |
          $reviewRoot = Join-Path $env:RUNNER_TEMP "agent-refactor-review-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $archivePath = "$reviewRoot.zip"
          New-Item -ItemType Directory -Path $reviewRoot -Force | Out-Null

          git -C $env:CANDIDATE_ROOT cat-file -e "$env:TRUSTED_SHA^{commit}"
          if ($LASTEXITCODE -ne 0) {
            throw "Trusted workflow commit $env:TRUSTED_SHA is unavailable."
          }
          git -C $env:CANDIDATE_ROOT archive --format=zip --output=$archivePath $env:TRUSTED_SHA .github/codex
          if ($LASTEXITCODE -ne 0) {
            throw "Could not archive the trusted review bundle."
          }
          Expand-Archive -LiteralPath $archivePath -DestinationPath $reviewRoot -Force
          Remove-Item -LiteralPath $archivePath -Force

          $bundleRoot = Join-Path $reviewRoot ".github\codex"
          $contextFile = Join-Path $bundleRoot "runtime\context.json"
          $promptFile = Join-Path $bundleRoot "prompts\agent-refactor-review.md"
          $schemaFile = Join-Path $bundleRoot "review-output.schema.json"
          $resultFile = Join-Path $reviewRoot "result.json"

          "review_root=$reviewRoot" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "bundle_root=$bundleRoot" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "context_file=$contextFile" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "prompt_file=$promptFile" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "schema_file=$schemaFile" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "result_file=$resultFile" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build immutable review context
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          EXPECTED_BASE_SHA: ${{ needs.resolve.outputs.base_sha }}
          EXPECTED_HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          ISSUE_NUMBERS: ${{ needs.resolve.outputs.issue_numbers }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          REVIEW_EVENT_KEY: ${{ needs.resolve.outputs.event_key }}
          REVIEW_CONTEXT_FILE: ${{ steps.trusted.outputs.context_file }}
          STACK_CHAIN: ${{ needs.resolve.outputs.stack_chain }}
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const prNumber = Number(process.env.PR_NUMBER);
            const issueNumbers = JSON.parse(process.env.ISSUE_NUMBERS);
            const stackChain = JSON.parse(process.env.STACK_CHAIN);
            const [pullResponse, files, commits, comments, reviews, reviewComments] = await Promise.all([
              github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              }),
              github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                per_page: 100,
              }),
              github.paginate(github.rest.pulls.listCommits, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                per_page: 100,
              }),
              github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                per_page: 100,
              }),
              github.paginate(github.rest.pulls.listReviews, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                per_page: 100,
              }),
              github.paginate(github.rest.pulls.listReviewComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                per_page: 100,
              }),
            ]);
            if (pullResponse.data.head.sha !== process.env.EXPECTED_HEAD_SHA) {
              throw new Error("The pull request head changed after event resolution.");
            }
            const issues = [];
            for (const issueNumber of issueNumbers) {
              const {data: issue} = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
              });
              issues.push({
                number: issue.number,
                title: issue.title,
                body: issue.body,
                labels: issue.labels.map((label) =>
                  typeof label === "string" ? label : label.name,
                ),
                state: issue.state,
              });
            }
            const pull = pullResponse.data;
            const pullRequestChain = await Promise.all(stackChain.map(async (entry) => {
              const [{data: chainPull}, chainReviews] = await Promise.all([
                github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: entry.number,
                }),
                github.paginate(github.rest.pulls.listReviews, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: entry.number,
                  per_page: 100,
                }),
              ]);
              return {
                ...entry,
                title: chainPull.title,
                body: chainPull.body,
                draft: chainPull.draft,
                reviews: chainReviews.slice(-50).map((review) => ({
                  author: review.user?.login,
                  association: review.author_association,
                  submitted_at: review.submitted_at,
                  state: review.state,
                  commit_id: review.commit_id,
                  body: review.body,
                })),
              };
            }));
            const reviewContext = {
              repository: `${context.repo.owner}/${context.repo.repo}`,
              event_name: context.eventName,
              event_key: process.env.REVIEW_EVENT_KEY,
              actor: context.actor,
              pull_request: {
                number: pull.number,
                title: pull.title,
                body: pull.body,
                state: pull.state,
                draft: pull.draft,
                base_ref: pull.base.ref,
                base_sha: process.env.EXPECTED_BASE_SHA,
                head_ref: pull.head.ref,
                head_sha: pull.head.sha,
                author: pull.user.login,
                candidate_merge_clean: process.env.CANDIDATE_MERGE_CLEAN === "true",
              },
              issues,
              pull_request_chain: pullRequestChain,
              files: files.map((file) => ({
                filename: file.filename,
                status: file.status,
                additions: file.additions,
                deletions: file.deletions,
              })),
              commits: commits.map((commit) => ({
                sha: commit.sha,
                message: commit.commit.message,
                author: commit.author?.login || commit.commit.author?.name,
              })),
              comments: comments.slice(-50).map((comment) => ({
                id: comment.id,
                author: comment.user?.login,
                created_at: comment.created_at,
                body: comment.body,
              })),
              reviews: reviews.slice(-50).map((review) => ({
                id: review.id,
                author: review.user?.login,
                submitted_at: review.submitted_at,
                state: review.state,
                commit_id: review.commit_id,
                body: review.body,
              })),
              review_comments: reviewComments.slice(-100).map((comment) => ({
                id: comment.id,
                in_reply_to_id: comment.in_reply_to_id,
                author: comment.user?.login,
                created_at: comment.created_at,
                updated_at: comment.updated_at,
                path: comment.path,
                line: comment.line,
                original_line: comment.original_line,
                side: comment.side,
                commit_id: comment.commit_id,
                body: comment.body,
              })),
              trigger: {
                action: context.payload.action,
                comment: context.payload.comment
                  ? {
                      id: context.payload.comment.id,
                      author: context.payload.comment.user?.login,
                      body: context.payload.comment.body,
                      path: context.payload.comment.path,
                      line: context.payload.comment.line,
                      in_reply_to_id: context.payload.comment.in_reply_to_id,
                    }
                  : null,
                review: context.payload.review
                  ? {
                      id: context.payload.review.id,
                      author: context.payload.review.user?.login,
                      state: context.payload.review.state,
                      body: context.payload.review.body,
                    }
                  : null,
              },
            };
            const contextFile = process.env.REVIEW_CONTEXT_FILE;
            const runtimeDirectory = path.dirname(contextFile);
            fs.mkdirSync(runtimeDirectory, {recursive: true});
            fs.writeFileSync(
              contextFile,
              JSON.stringify(reviewContext, null, 2),
              {encoding: "utf8", mode: 0o600},
            );

      - name: Verify local Codex uses ChatGPT authentication
        shell: pwsh
        run: |
          if ($env:OPENAI_API_KEY -or $env:CODEX_API_KEY) {
            throw "API-key authentication is forbidden for this local review job."
          }
          $loginStatus = (codex login status 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $loginStatus -notmatch "Logged in using ChatGPT") {
            throw "Codex CLI is not logged in with ChatGPT for the runner account."
          }
          Write-Host $loginStatus

      - name: Run the Agent refactor review
        id: codex
        shell: pwsh
        env:
          CANDIDATE_ROOT: ${{ steps.candidate.outputs.candidate_root }}
          REVIEW_BUNDLE_ROOT: ${{ steps.trusted.outputs.bundle_root }}
          REVIEW_CONTEXT_FILE: ${{ steps.trusted.outputs.context_file }}
          REVIEW_PROMPT_FILE: ${{ steps.trusted.outputs.prompt_file }}
          REVIEW_RESULT_FILE: ${{ steps.trusted.outputs.result_file }}
          REVIEW_SCHEMA_FILE: ${{ steps.trusted.outputs.schema_file }}
        run: |
          $trustedHeader = @"
          The following absolute paths were materialized from the trusted workflow commit,
          outside the candidate workspace. Treat them as policy, not candidate content:
          - review context: $env:REVIEW_CONTEXT_FILE
          - code-review skill: $env:REVIEW_BUNDLE_ROOT\skills\code-review\SKILL.md
          - output schema: $env:REVIEW_SCHEMA_FILE

          Use those exact paths wherever the policy below refers to the trusted runtime
          context or bundled code-review skill.

          "@
          $policyPrompt = Get-Content -LiteralPath $env:REVIEW_PROMPT_FILE -Raw -Encoding utf8
          $fullPrompt = $trustedHeader + $policyPrompt

          $fullPrompt | codex exec `
            --ephemeral `
            --ignore-user-config `
            --approve-for-me `
            --cd $env:CANDIDATE_ROOT `
            --output-schema $env:REVIEW_SCHEMA_FILE `
            --output-last-message $env:REVIEW_RESULT_FILE `
            -
          if ($LASTEXITCODE -ne 0) {
            throw "Codex review failed with exit code $LASTEXITCODE."
          }

          $finalMessage = Get-Content -LiteralPath $env:REVIEW_RESULT_FILE -Raw -Encoding utf8
          $null = $finalMessage | ConvertFrom-Json
          $delimiter = "codex-review-$([guid]::NewGuid().ToString('N'))"
          "final-message<<$delimiter" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $finalMessage | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $delimiter | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Remove temporary trusted review material
        if: always()
        shell: pwsh
        env:
          CANDIDATE_ROOT: ${{ steps.candidate.outputs.candidate_root }}
          REVIEW_ROOT: ${{ steps.trusted.outputs.review_root }}
        run: |
          $runnerTemp = [IO.Path]::GetFullPath($env:RUNNER_TEMP)
          foreach ($pathToRemove in @($env:REVIEW_ROOT, $env:CANDIDATE_ROOT)) {
            if (-not $pathToRemove) {
              continue
            }
            $fullPath = [IO.Path]::GetFullPath($pathToRemove)
            if (-not $fullPath.StartsWith($runnerTemp, [StringComparison]::OrdinalIgnoreCase)) {
              throw "Refusing to remove a path outside RUNNER_TEMP: $fullPath"
            }
            if (Test-Path -LiteralPath $fullPath) {
              Remove-Item -LiteralPath $fullPath -Recurse -Force
            }
          }

  publish:
    needs:
      - resolve
      - review
    if: >-
      needs.review.result == 'success' &&
      needs.review.outputs.final_message != ''
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Materialize trusted review policy
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          TRUSTED_SHA: ${{ github.workflow_sha }}
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const policyPath = ".github/codex/scripts/review-policy.js";
            const {data} = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: policyPath,
              ref: process.env.TRUSTED_SHA,
            });
            if (Array.isArray(data) || data.type !== "file" || !data.content) {
              throw new Error("Trusted review policy is not a readable file.");
            }
            const destination = path.join(
              process.env.GITHUB_WORKSPACE,
              ".review-automation",
              policyPath,
            );
            fs.mkdirSync(path.dirname(destination), {recursive: true});
            fs.writeFileSync(destination, Buffer.from(data.content, "base64"), {mode: 0o600});

      - name: Publish verdict and merge an accepted PR
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          EXPECTED_HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          EXPECTED_BASE_SHA: ${{ needs.resolve.outputs.base_sha }}
          EXPECTED_ISSUE_NUMBERS: ${{ needs.resolve.outputs.issue_numbers }}
          EXPECTED_STACK_CHAIN: ${{ needs.resolve.outputs.stack_chain }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          REVIEW_EVENT_KEY: ${{ needs.resolve.outputs.event_key }}
          REVIEW_RESULT: ${{ needs.review.outputs.final_message }}
        with:
          script: |
            const policy = require(
              `${process.env.GITHUB_WORKSPACE}/.review-automation/.github/codex/scripts/review-policy.js`,
            );
            const prNumber = Number(process.env.PR_NUMBER);
            let result;
            try {
              result = JSON.parse(process.env.REVIEW_RESULT);
              policy.assertValidReviewResult(result);
            } catch (error) {
              core.setFailed(`Codex returned an invalid review result: ${error.message}`);
              return;
            }

            const expectedHead = process.env.EXPECTED_HEAD_SHA;
            const expectedBase = process.env.EXPECTED_BASE_SHA;
            if (result.head_sha !== expectedHead) {
              core.setFailed(`Review result used ${result.head_sha}; expected ${expectedHead}.`);
              return;
            }
            const expectedIssues = JSON.parse(process.env.EXPECTED_ISSUE_NUMBERS);
            const returnedIssues = [...result.issue_numbers].sort((left, right) => left - right);
            if (JSON.stringify(returnedIssues) !== JSON.stringify(expectedIssues)) {
              core.setFailed("Review result issue numbers do not match the resolved PR relationships.");
              return;
            }
            const {data: pull} = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            if (pull.head.sha !== expectedHead) {
              core.notice("The PR changed after review; the synchronize event will review the new head.");
              return;
            }
            if (pull.base.sha !== expectedBase) {
              core.notice("The target branch changed after review; dispatching a review for the new base.");
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: "agent-refactor-review.yml",
                ref: "dev",
                inputs: {pr_number: String(prNumber)},
              });
              return;
            }
            let currentStackChain;
            try {
              currentStackChain = await policy.resolvePullChain(
                pull,
                async (headRef) => github.paginate(github.rest.pulls.list, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: "open",
                  head: `${context.repo.owner}:${headRef}`,
                  per_page: 100,
                }),
                `${context.repo.owner}/${context.repo.repo}`,
                "refactor/agent",
              );
            } catch (error) {
              core.setFailed(`The PR stack is no longer valid: ${error.message}`);
              return;
            }
            const expectedStackChain = JSON.parse(process.env.EXPECTED_STACK_CHAIN);
            if (JSON.stringify(currentStackChain) !== JSON.stringify(expectedStackChain)) {
              core.notice("The PR stack changed after review; dispatching a fresh review.");
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: "agent-refactor-review.yml",
                ref: "dev",
                inputs: {pr_number: String(prNumber)},
              });
              return;
            }

            let parentApprovalIssue = null;
            for (const parent of currentStackChain.slice(1)) {
              const parentReviews = await github.paginate(github.rest.pulls.listReviews, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: parent.number,
                per_page: 100,
              });
              const violation = policy.parentApprovalViolation(
                parentReviews,
                parent.head_sha,
              );
              if (violation) {
                parentApprovalIssue = `父 PR #${parent.number} 的当前 head 不再满足批准门禁：${violation}`;
                break;
              }
            }

            const marker = `<!-- agent-refactor-review-key:${process.env.REVIEW_EVENT_KEY} -->`;
            const findingSection = (title, findings) => {
              const lines = [`## ${title}`, ""];
              if (!findings.length) return [...lines, "通过，无阻塞项。", ""].join("\n");
              for (const finding of findings) {
                const location = finding.file
                  ? `（${finding.file}${finding.line ? `:${finding.line}` : ""}）`
                  : "";
                lines.push(
                  `- **[${finding.severity}] ${finding.title}**${location}`,
                  `  ${finding.detail}`,
                  `  要求：${finding.required_change}`,
                );
              }
              lines.push("");
              return lines.join("\n");
            };
            const tests = result.tests.length
              ? result.tests.map((test) => {
                  const requirement = test.required ? "required" : "optional";
                  const skip = test.skip_reason ? `，skip_reason=${test.skip_reason}` : "";
                  return `- \`${test.command}\` → **${test.status}**（${requirement}${skip}）：${test.details}`;
                }).join("\n")
              : "- 未记录验证命令。";
            let body = [
              marker,
              `结论：**${result.verdict}**（阶段：${result.phase}）`,
              "",
              result.summary,
              "",
              findingSection("流程与 TDD", result.flow_findings),
              findingSection("Standards", result.standards_findings),
              findingSection("Spec", result.spec_findings),
              "## 黑盒验证",
              "",
              tests,
            ].join("\n");

            const passViolation = policy.passViolation(result);
            if (passViolation) {
              result.verdict = "CHANGES_REQUESTED";
              body += `\n\n工作流保护：${passViolation}；已拒绝合并。`;
            }
            if (parentApprovalIssue) {
              result.verdict = "CHANGES_REQUESTED";
              body += `\n\n工作流保护：${parentApprovalIssue}；已拒绝合并。`;
            }

            if (result.verdict === "PASS" && !pull.draft) {
              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                per_page: 100,
              });
              const currentHeadChangeRequest = policy.latestHumanChangeRequest(
                reviews,
                expectedHead,
              );
              if (currentHeadChangeRequest) {
                result.verdict = "CHANGES_REQUESTED";
                body += `\n\n${currentHeadChangeRequest.user.login} 对当前 head 提出了修改请求，已拒绝合并。`;
              }
            }

            let reviewEvent = "COMMENT";
            if (result.verdict === "CHANGES_REQUESTED") reviewEvent = "REQUEST_CHANGES";
            if (result.verdict === "PASS") reviewEvent = "APPROVE";

            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              commit_id: expectedHead,
              event: reviewEvent,
              body,
            });

            if (result.verdict !== "PASS") return;
            if (pull.draft) {
              core.notice("Review passed, but the PR is still Draft; ready_for_review will trigger again.");
              return;
            }

            const merge = await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              sha: expectedHead,
              merge_method: "squash",
            });
            if (!merge.data.merged) {
              core.setFailed(`GitHub refused the squash merge: ${merge.data.message}`);
            }
