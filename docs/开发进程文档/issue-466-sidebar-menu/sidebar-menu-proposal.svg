<svg xmlns="http://www.w3.org/2000/svg" width="948" height="1100" viewBox="0 0 948 1100" role="img" aria-labelledby="title description">
  <title id="title">AgentLuo 侧边栏菜单顺序草图</title>
  <desc id="description">按日常功能、设置、维护、协议与账号重排侧栏，展示浅色与深色两种模式。沿用现有侧栏占屏幕百分之三十八、十二点水平内边距、八点圆角、十四点菜单文字与纵向颜色模式选项。右侧聊天区仅为背景示意。</desc>
  <defs>
    <filter id="screenShadow" x="-15%" y="-8%" width="140%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#203244" flood-opacity="0.10"/>
    </filter>
    <filter id="drawerShadow" x="-20%" y="-5%" width="160%" height="110%">
      <feDropShadow dx="4" dy="0" stdDeviation="6" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
    <clipPath id="screenClip"><rect width="412" height="915" rx="24"/></clipPath>
    <linearGradient id="lightStage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#edf9ff"/><stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="darkStage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#203747"/><stop offset="1" stop-color="#0f1419"/>
    </linearGradient>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; }
      .item { font-size: 14px; font-weight: 600; }
      .mode { font-size: 13px; }
      .status { font-family: "Segoe UI", sans-serif; font-size: 12px; font-weight: 600; }
    </style>
  </defs>

  <rect width="948" height="1100" fill="#f2f5f8"/>
  <text x="44" y="41" font-size="24" font-weight="700" fill="#243447">侧边栏 · 菜单顺序草图</text>
  <text x="44" y="65" font-size="13" fill="#7b8794">沿用现有样式 · Android · 412 × 915 dp · 侧栏宽 157 dp（38%）</text>
  <circle cx="50" cy="91" r="5" fill="#ffffff" stroke="#c6d0da"/>
  <text x="63" y="95" font-size="13" font-weight="600" fill="#4b5967">浅色模式</text>
  <circle cx="498" cy="91" r="5" fill="#18202a"/>
  <text x="511" y="95" font-size="13" font-weight="600" fill="#4b5967">深色模式</text>

  <!-- Light: native dp dimensions, with reordered menu and restrained separators. -->
  <g transform="translate(44 112)">
    <rect width="412" height="915" rx="24" fill="#ffffff" filter="url(#screenShadow)"/>
    <g clip-path="url(#screenClip)">
      <!-- Chat backdrop is schematic, not a screenshot. -->
      <rect width="412" height="915" fill="#ffffff"/>
      <rect y="24" width="412" height="390" fill="url(#lightStage)"/>
      <circle cx="322" cy="179" r="85" fill="#d9eff7" opacity="0.45"/>
      <rect y="414" width="412" height="417" fill="#e8e8e8"/>
      <rect x="190" y="458" width="175" height="54" rx="10" fill="#88edff"/>
      <rect x="205" y="476" width="139" height="5" rx="2.5" fill="#4b7d86" opacity="0.24"/>
      <rect x="205" y="489" width="100" height="5" rx="2.5" fill="#4b7d86" opacity="0.24"/>
      <rect x="236" y="543" width="150" height="42" rx="10" fill="#ffffff"/>
      <rect x="251" y="561" width="119" height="5" rx="2.5" fill="#7b8794" opacity="0.24"/>
      <rect x="190" y="617" width="175" height="66" rx="10" fill="#88edff"/>
      <rect x="205" y="635" width="139" height="5" rx="2.5" fill="#4b7d86" opacity="0.24"/>
      <rect x="205" y="648" width="120" height="5" rx="2.5" fill="#4b7d86" opacity="0.24"/>
      <rect x="205" y="661" width="76" height="5" rx="2.5" fill="#4b7d86" opacity="0.24"/>
      <rect y="831" width="412" height="60" fill="#f0f0f0"/>
      <rect x="179" y="843" width="180" height="36" rx="8" fill="#ffffff" stroke="#dddddd"/>
      <circle cx="384" cy="861" r="14" fill="#e0e5e9"/>
      <rect x="157" width="255" height="915" fill="#000000" opacity="0.32"/>
      <g filter="url(#drawerShadow)"><rect width="157" height="915" fill="#ffffff"/></g>
      <path d="M156.5 0V915" stroke="#d9e1e8"/>

      <text x="12" y="61" font-size="19" font-weight="700" fill="#243447">菜单</text>
      <text x="12" y="80" font-size="12" fill="#7b8794">洛天依 Agent</text>
      <g class="item" fill="#243447">
        <rect x="12" y="110" width="133" height="42" rx="8" fill="#f4f8fb"/>
        <text x="22" y="137">动态</text>
        <rect x="12" y="162" width="133" height="42" rx="8" fill="#f4f8fb"/>
        <text x="22" y="189">语音通话</text>
        <path d="M12 222.5H145" stroke="#d9e1e8"/>
        <rect x="12" y="234" width="133" height="42" rx="8" fill="#f4f8fb"/>
        <text x="22" y="261">配置偏好</text>
        <rect x="12" y="286" width="133" height="42" rx="8" fill="#f4f8fb"/>
        <text x="22" y="313">LLM 模型设置</text>
      </g>
      <path d="M12 340.5H145" stroke="#d9e1e8"/>
      <g class="item" fill="#243447">
        <rect x="12" y="353" width="133" height="48" rx="8" fill="#f4f8fb"/>
        <text x="22" y="383">聊天与记忆迁移</text>
        <rect x="12" y="411" width="133" height="42" rx="8" fill="#f4f8fb"/>
        <text x="22" y="438">打开调试界面</text>
      </g>
      <path d="M12 475.5H145" stroke="#d9e1e8"/>
      <text x="12" y="498" font-size="12" font-weight="700" fill="#7b8794">颜色模式</text>
      <rect x="12" y="510" width="133" height="34" rx="8" fill="#e8f6ff" stroke="#66ccff"/>
      <text x="22" y="532" class="mode" font-weight="700" fill="#1674a3">浅色</text>
      <rect x="12" y="550" width="133" height="34" rx="8" fill="#ffffff" stroke="#d9e1e8"/>
      <text x="22" y="572" class="mode" fill="#4b5967">深色</text>
      <rect x="12" y="590" width="133" height="34" rx="8" fill="#ffffff" stroke="#d9e1e8"/>
      <text x="22" y="612" class="mode" fill="#4b5967">跟随系统</text>
      <g class="item" fill="#243447">
        <!-- PR #304: agreement follows the flexible spacer, directly above logout. -->
        <rect x="12" y="787" width="133" height="42" rx="8" fill="#f4f8fb"/>
        <text x="22" y="814">用户协议</text>
      </g>
      <rect x="12" y="839" width="133" height="42" rx="8" fill="#fff1f1"/>
      <text x="22" y="866" class="item" fill="#c24141">登出</text>
      <rect x="154" y="902" width="104" height="4" rx="2" fill="#243447" opacity="0.45"/>
    </g>
    <rect x="0.5" y="0.5" width="411" height="914" rx="23.5" fill="none" stroke="#cfd9e2"/>
  </g>

  <!-- Dark: identical geometry, colors from THEMES.dark. -->
  <g transform="translate(492 112)">
    <rect width="412" height="915" rx="24" fill="#0f1419" filter="url(#screenShadow)"/>
    <g clip-path="url(#screenClip)">
      <rect width="412" height="915" fill="#0f1419"/>
      <rect y="24" width="412" height="390" fill="url(#darkStage)"/>
      <circle cx="322" cy="179" r="85" fill="#40677d" opacity="0.16"/>
      <rect y="414" width="412" height="417" fill="#121a22"/>
      <rect x="190" y="458" width="175" height="54" rx="10" fill="#0d5b73"/>
      <rect x="205" y="476" width="139" height="5" rx="2.5" fill="#d7e6f1" opacity="0.24"/>
      <rect x="205" y="489" width="100" height="5" rx="2.5" fill="#d7e6f1" opacity="0.24"/>
      <rect x="236" y="543" width="150" height="42" rx="10" fill="#2b3542"/>
      <rect x="251" y="561" width="119" height="5" rx="2.5" fill="#d7e6f1" opacity="0.24"/>
      <rect x="190" y="617" width="175" height="66" rx="10" fill="#0d5b73"/>
      <rect x="205" y="635" width="139" height="5" rx="2.5" fill="#d7e6f1" opacity="0.24"/>
      <rect x="205" y="648" width="120" height="5" rx="2.5" fill="#d7e6f1" opacity="0.24"/>
      <rect x="205" y="661" width="76" height="5" rx="2.5" fill="#d7e6f1" opacity="0.24"/>
      <rect y="831" width="412" height="60" fill="#151c24"/>
      <rect x="179" y="843" width="180" height="36" rx="8" fill="#202a34" stroke="#2c3642"/>
      <circle cx="384" cy="861" r="14" fill="#202a34"/>
      <rect x="157" width="255" height="915" fill="#000000" opacity="0.32"/>
      <g filter="url(#drawerShadow)"><rect width="157" height="915" fill="#18202a"/></g>
      <path d="M156.5 0V915" stroke="#2e3946"/>

      <text x="12" y="61" font-size="19" font-weight="700" fill="#eef4f8">菜单</text>
      <text x="12" y="80" font-size="12" fill="#9aa8b7">洛天依 Agent</text>
      <g class="item" fill="#eef4f8">
        <rect x="12" y="110" width="133" height="42" rx="8" fill="#202a34"/>
        <text x="22" y="137">动态</text>
        <rect x="12" y="162" width="133" height="42" rx="8" fill="#202a34"/>
        <text x="22" y="189">语音通话</text>
        <path d="M12 222.5H145" stroke="#2e3946"/>
        <rect x="12" y="234" width="133" height="42" rx="8" fill="#202a34"/>
        <text x="22" y="261">配置偏好</text>
        <rect x="12" y="286" width="133" height="42" rx="8" fill="#202a34"/>
        <text x="22" y="313">LLM 模型设置</text>
      </g>
      <path d="M12 340.5H145" stroke="#2e3946"/>
      <g class="item" fill="#eef4f8">
        <rect x="12" y="353" width="133" height="48" rx="8" fill="#202a34"/>
        <text x="22" y="383">聊天与记忆迁移</text>
        <rect x="12" y="411" width="133" height="42" rx="8" fill="#202a34"/>
        <text x="22" y="438">打开调试界面</text>
      </g>
      <path d="M12 475.5H145" stroke="#2e3946"/>
      <text x="12" y="498" font-size="12" font-weight="700" fill="#9aa8b7">颜色模式</text>
      <rect x="12" y="510" width="133" height="34" rx="8" fill="#18202a" stroke="#2e3946"/>
      <text x="22" y="532" class="mode" fill="#c6d0da">浅色</text>
      <rect x="12" y="550" width="133" height="34" rx="8" fill="#12384b" stroke="#66ccff"/>
      <text x="22" y="572" class="mode" font-weight="700" fill="#bdeeff">深色</text>
      <rect x="12" y="590" width="133" height="34" rx="8" fill="#18202a" stroke="#2e3946"/>
      <text x="22" y="612" class="mode" fill="#c6d0da">跟随系统</text>
      <g class="item" fill="#eef4f8">
        <!-- PR #304: agreement follows the flexible spacer, directly above logout. -->
        <rect x="12" y="787" width="133" height="42" rx="8" fill="#202a34"/>
        <text x="22" y="814">用户协议</text>
      </g>
      <rect x="12" y="839" width="133" height="42" rx="8" fill="#3a2024"/>
      <text x="22" y="866" class="item" fill="#ff9a9a">登出</text>
      <rect x="154" y="902" width="104" height="4" rx="2" fill="#eef4f8" opacity="0.45"/>
    </g>
    <rect x="0.5" y="0.5" width="411" height="914" rx="23.5" fill="none" stroke="#2e3946"/>
  </g>

  <text x="44" y="1060" font-size="13" fill="#4b5967">日常功能 → 设置 → 维护 → 颜色模式；用户协议与登出按 PR #304 一起置底。</text>
  <text x="44" y="1082" font-size="12" fill="#7b8794">颜色、圆角和字号参考现有实现；右侧聊天背景为示意。本图不含尚未合入 dev 的头像设置。</text>
</svg>
