<rect x="920" y="963" width="472" height="470" rx="12" fill="#ffffff" stroke="none" />
<text x="944" y="1001" font-size="21" style="fill:#17283d" font-weight="700" xml:space="preserve">共同状态与行为</text>
<text x="944" y="1040" font-size="16" style="fill:#17283d" font-weight="700" xml:space="preserve">阅读中 → 可确认</text>
<text x="944" y="1067" font-size="14" style="fill:#64748b" font-weight="400" xml:space="preserve">累计前台 5 秒，并且到过正文底部。</text>
<text x="944" y="1110" font-size="16" style="fill:#17283d" font-weight="700" xml:space="preserve">可确认 → 正在提交…</text>
<text x="944" y="1137" font-size="14" style="fill:#64748b" font-weight="400" xml:space="preserve">按钮禁用，避免重复提交。</text>
<text x="944" y="1180" font-size="16" style="fill:#17283d" font-weight="700" xml:space="preserve">网络失败 → 可重试</text>
<text x="944" y="1207" font-size="14" style="fill:#64748b" font-weight="400" xml:space="preserve">同版本、同窗口保留阅读完成状态。</text>
<text x="944" y="1250" font-size="16" style="fill:#17283d" font-weight="700" xml:space="preserve">协议换版 → 重新阅读</text>
<text x="944" y="1277" font-size="14" style="fill:#64748b" font-weight="400" xml:space="preserve">加载新版，重置计时与底部状态。</text>
<text x="944" y="1320" font-size="16" style="fill:#17283d" font-weight="700" xml:space="preserve">关闭 / 拒绝</text>
<text x="944" y="1347" font-size="14" style="fill:#64748b" font-weight="400" xml:space="preserve">新用户回表单；老用户直接退出。</text>
<text x="48" y="1483" font-size="16" style="fill:#475569" font-weight="400" xml:space="preserve">浅灰 = 禁用    浅蓝 = 可点击    深灰蒙版 = 背景不可操作</text>
<text x="48" y="1516" font-size="15" style="fill:#64748b" font-weight="400" xml:space="preserve">设置查阅复用正文渲染；桌面只读窗口底部显示“关闭”，不显示签署操作。</text>
<text x="48" y="1548" font-size="14" style="fill:#64748b" font-weight="400" xml:space="preserve">对齐样例：段落标题居中，正文非末行两端对齐，末行及显式换行前的行不拉伸。</text>
