<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1580" viewBox="0 0 1440 1580" role="img" aria-labelledby="title desc"><title id="title">用户协议签署 UI 草图</title><desc id="desc">App 阅读倒计时、可确认状态、设置只读查阅，以及桌面独立模态协议窗口和状态转换。正文仅为排版样例。</desc><style>text{font-family:Microsoft YaHei, Noto Sans CJK SC, sans-serif;fill:#17283d} .muted{fill:#64748b}</style>
