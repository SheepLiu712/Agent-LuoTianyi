<text x="548" y="1095" text-anchor="middle" font-size="23" style="fill:#17283d" font-weight="700" xml:space="preserve">一、使用说明</text>
<text x="272" y="1130" font-size="16" style="fill:#17283d" font-weight="400" xml:space="preserve">以下仅为排版样例。请仔细阅读本协议的重要内容。</text>
<text x="272" y="1162" textLength="544" lengthAdjust="spacing" font-size="16" style="fill:#17283d" font-weight="700" xml:space="preserve">标题居中；正文两端对齐，重点可加粗。</text>
<text x="272" y="1194" font-size="16" style="fill:#17283d" font-weight="400" xml:space="preserve">保留换行与空格：甲  乙    丙。长行自动换行。</text>
<text x="272" y="1226" font-size="16" style="fill:#64748b" font-weight="400" xml:space="preserve">继续向下滚动阅读……</text>
<rect x="840" y="1080" width="4" height="174" rx="2" fill="#e2e8f0" stroke="none" />
<rect x="840" y="1080" width="4" height="48" rx="2" fill="#94a3b8" stroke="none" />
<rect x="250" y="1272" width="614" height="1" rx="0" fill="#e2e8f0" stroke="none" />
<text x="272" y="1300" font-size="14" style="fill:#64748b" font-weight="400" xml:space="preserve">请阅读至协议底部</text>
<rect x="272" y="1324" width="190" height="44" rx="8" fill="#f1f5f9" stroke="none" />
<text x="314" y="1352" font-size="14" style="fill:#17283d" font-weight="400" xml:space="preserve">不同意并退出</text>
