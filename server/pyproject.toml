[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "agentluo-server"
version = "0.1.0"
description = "AgentLuo virtual singer agent server"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = "MIT"
dependencies = [
    "bcrypt",
    "beautifulsoup4",
    "chromadb",
    "colorlog",
    "cryptography",
    "fastapi>=0.128,<1",
    "flashtext",
    "jinja2",
    "librosa>=0.9.2,<0.10",
    "lunardate",
    "networkx",
    "numpy>=1.24,<2",
    "openai",
    "pillow",
    "playwright",
    "psutil",
    "pydantic>=2.13.3,<3",
    "pydub",
    "python-jose",
    "PyYAML>=6",
    "requests",
    "sqlalchemy>=2,<3",
    "typing-extensions",
    "tzdata; platform_system == 'Windows'",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
# TTS worker dependencies. PyTorch is installed separately so the operator can
# choose a CPU or CUDA wheel source before resolving these extras.
speech = [
    "gsv-tts-lite>=0.4,<0.5",
    "soundfile>=0.12",
]
# Heavy, hardware-sensitive dependencies used only by the automatic song
# learning pipeline. Keeping them out of the base install makes the server's
# ordinary development and test environment reproducible.
song-learning = [
    "asteroid==0.7.0",
    "audiomentations==0.24.0",
    "auraloss",
    "beartype==0.14.1",
    "bitsandbytes",
    "cvxopt",
    "demucs==4.0.0",
    "einops==0.8.1",
    "hyper-connections==0.1.11",
    "jams>=0.3.0",
    "joblib",
    "loralib",
    "matplotlib",
    "mir-eval",
    "ml-collections",
    "moises-light",
    "omegaconf==2.2.3",
    "pandas",
    "pedalboard~=0.8.1",
    "peft",
    "prodigyopt",
    "pytorch-optimizer",
    "qqmusic-api-python==0.6.9",
    "rotary-embedding-torch",
    "scikit-learn",
    "scipy",
    "segmentation-models-pytorch==0.3.3",
    "six",
    "spafe==0.3.2",
    "timm==0.9.2",
    "torch-audiomentations",
    "torch-l1-snr>=0.1.2",
    "torch-log-wmse>=0.3.1",
    "torchseg",
    "tqdm",
    "transformers>=4.57.1",
    "vmo>=0.3.3",
    "wandb",
]
dev = [
    "black==26.5.1",
    "build>=1.2,<2",
    "coverage[toml]==7.16.1",
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.14.10",
    "setuptools>=80,<81",
]

[project.urls]
Repository = "https://github.com/SheepLiu712/Agent-LuoTianyi"

[tool.setuptools]
include-package-data = false
py-modules = ["server_main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]
namespaces = true

[tool.ruff]
required-version = "==0.14.10"
target-version = "py310"
line-length = 120

# 第一阶段只对 Agent 深模块重构的生产代码设置门禁。
include = [
    "src/agent/**/*.py",
    "src/agent_runtime/**/*.py",
    "src/domain/agent/**/*.py",
    "src/stage/**/*.py",
]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "W291",
    "W292",
    "W293",
    "W605",
    "E501",
    "C901",
]
ignore = []

[tool.ruff.lint.mccabe]
# 复杂度超过 10 时触发 C901，必须人工检查、拆分或说明例外理由。
max-complexity = 10

[tool.black]
target-version = ["py310"]
line-length = 120
# 与第一阶段 Ruff 门禁保持相同的 Agent 重构范围。
include = 'src/(agent|agent_runtime|domain/agent|stage)/.*\.py$'

[tool.coverage.run]
source = [
    "src/agent",
    "src/agent_runtime",
    "src/domain/agent",
    "src/stage",
]

[tool.coverage.report]
# Agent 重构范围首先由单元测试守住最低行覆盖率；集成与 E2E 另验行为不变量。
fail_under = 40
precision = 2
show_missing = true
